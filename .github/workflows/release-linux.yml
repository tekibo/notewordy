name: Build & Release Linux AppImage

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            wget \
            file

      - name: Install Dependencies
        run: pnpm install

      - name: Build Application
        run: pnpm build

      - name: Package AppImage
        run: |
          # 1. Download appimagetool
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool

          # 2. Assemble AppDir from Electrobun's stable build output
          mkdir -p AppDir
          cp -r apps/desktop/build/stable-linux-x64/NoteWordy/* AppDir/

          # 3. Create AppRun launcher
          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/bin/launcher" "$@"
          EOF
          chmod +x AppDir/AppRun

          # 4. Copy icon & desktop entry
          cp apps/web/app/assets/logo.png AppDir/NoteWordy.png
          cp apps/web/app/assets/logo.png AppDir/.DirIcon

          # Fix icon path in desktop file if needed
          if [ -f AppDir/NoteWordy.desktop ]; then
            sed -i 's/^Icon=.*/Icon=NoteWordy/' AppDir/NoteWordy.desktop
          else
            cat << 'EOF' > AppDir/NoteWordy.desktop
          [Desktop Entry]
          Name=NoteWordy
          Exec=NoteWordy
          Icon=NoteWordy
          Type=Application
          Categories=Utility;TextEditor;
          EOF
          fi

          # 5. Build AppImage without FUSE requirement
          ./appimagetool --appimage-extract-and-run AppDir NoteWordy-x86_64.AppImage

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            NoteWordy-x86_64.AppImage
            apps/desktop/artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoteWordy-Linux-x86_64
          path: |
            NoteWordy-x86_64.AppImage
            apps/desktop/artifacts/*
